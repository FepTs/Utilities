name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          python -m ruff check main.py yolo_utils src tests
          python -m ruff format --check main.py yolo_utils src tests
      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Build lightweight executable
        run: python -m PyInstaller --noconfirm --clean YoloUtilities.spec
      - name: Smoke-test executable
        run: |
          $process = Start-Process -FilePath "dist/YoloUtilities.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: YoloUtilities-windows
          path: dist/YoloUtilities.exe
